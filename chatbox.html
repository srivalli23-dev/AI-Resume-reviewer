<div class="chatbox" id="resume-guider">
  <div class="chatbox-header">Resume Guider</div>
  <div class="chatbox-messages" style="height:180px;max-height:180px;overflow-y:auto;"></div>
  <div class="chatbox-input">
    <form style="display:flex;width:100%;">
      <input type="text" name="message" placeholder="Ask anything..." required style="flex:1;">
      <button type="submit">&#9658;</button>
    </form>
  </div>
</div>
